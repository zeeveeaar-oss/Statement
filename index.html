<!DOCTYPE html>
<html>
<head>
    <title>Statement</title>
</head>
<body>
    <h1>JavaScript Statements</h1>
    <p>A <b>JavaScript statement</b> is a list of 
    <b>Statement</b> To be executed by the computer</p>

    <p id="demo"></p>

    <script>
        var x,y,z; //statement 1//
        x = 5; //statement 2//
         y =6; //statement 3/
         z = x + y //statement 4//
         document.getElementById("demo").innerHTML = "The value of z is: " x + y ;
    </script>
</body>
</html>
